name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install kcov
      uses: shrink/actions-docker-extract@v4
      with:
        image: "kcov/kcov:v42"
        path: "/usr/local/bin/kcov"
        destination: "/usr/local/bin/kcov"
    
    - name: Install bash_unit
      run: |
        cd test && make install-bash-unit
    
    - name: Run unit tests
      run: |
        cd test && make test-unit
        
    - name: Run integration tests
      run: |
        cd test && make test-integration
    
    - name: Run plugin system tests
      run: |
        cd test && ./bash_unit test_plugin_system.sh
    
    - name: Run isolated tests
      run: |
        cd test && ./bash_unit test_isolated_final.sh
    
    - name: Generate coverage report
      run: |
        cd test && make coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./test/coverage/index.html
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: |
          test/*.log
          test/coverage/
          output/
        retention-days: 7

  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build test image
      run: |
        docker build -t oci-img-diff-build-test .
    
    - name: Test image functionality
      run: |
        # Test basic functionality
        docker run --rm -v /tmp:/output oci-img-diff-build-test \
          --left alpine:3.22.2 \
          --right alpine:3.23.4 \
          --format text \
          --path /etc
        
        # Verify output
        test -f /tmp/diff_report.txt
        test -s /tmp/diff_report.txt
        
        # Test archive inflation feature
        docker run --rm -v /tmp:/output oci-img-diff-build-test \
          --left alpine:3.22.2 \
          --right alpine:3.23.4 \
          --format text \
          --path /usr/lib \
          --inflate
        
        # Verify inflation worked
        test -f /tmp/diff_report.txt
